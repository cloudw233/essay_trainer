name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.0.12077973'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: Install SQLite headers for sqflite_common_ffi
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  android-debug:
    name: Build debug APK
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", but Google removed
          # the legacy `tools` package from the SDK repository, so sdkmanager
          # exits 1 with "Failed to find package 'tools'". Ask only for the
          # packages that still exist.
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      # The repo points Gradle at a Huawei mirror for the author's local
      # network. GitHub runners should use the official distribution.
      - name: Use official Gradle distribution in CI
        run: |
          sed -i \
            's#mirrors.huaweicloud.com/gradle/gradle-8.12-all.zip#services.gradle.org/distributions/gradle-8.12-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essay-trainer-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
