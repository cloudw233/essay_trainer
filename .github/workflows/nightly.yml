name: Nightly

# Builds an installable debug-signed APK every night (03:00 Asia/Shanghai) and
# uploads it as an artifact. It never signs with the release key and never
# creates a GitHub Release: those happen on the maintainer's machine with
# tool/release.sh, which is the only place the release keystore exists.
on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.6'
  NDK_VERSION: '27.0.12077973'

jobs:
  nightly:
    name: Build nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The repo points Gradle at a Huawei mirror for the author's local
      # network. GitHub runners should use the official distribution.
      - name: Use official Gradle distribution in CI
        run: |
          sed -i \
            's#mirrors.huaweicloud.com/gradle/gradle-8.12-all.zip#services.gradle.org/distributions/gradle-8.12-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Package nightly artifact
        run: |
          set -euo pipefail
          date="$(date -u +%Y%m%d)"
          sha="$(git rev-parse --short=7 HEAD)"
          name="essay_trainer-nightly-${date}-${sha}-arm64-v8a.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)
          echo "ARTIFACT_NAME=essay-trainer-nightly-${date}-${sha}" >> "$GITHUB_ENV"
          {
            echo "### Nightly $date ($sha)"
            echo
            echo "- 这是 CI 构建的 \`debug\` 签名测试包，不是正式发行版。"
            echo "- 正式版由维护者在本机用发布密钥签名并通过 \`tool/release.sh\` 发布。"
            echo "- APK 为 arm64-v8a，直接下载 artifact 解压后安装。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
