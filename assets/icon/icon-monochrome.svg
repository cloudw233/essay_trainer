<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">文衡 monochrome mark</title>
  <desc id="desc">One-color version. The caret becomes a transparent slot through the rules, leaving a solid diamond at its head.</desc>
