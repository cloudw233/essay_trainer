name: Release

# Pushing a vX.Y.Z tag builds, signs and publishes the APK. The version in the
# tag must match pubspec.yaml; the signing key comes from repository secrets.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.6'
  NDK_VERSION: '27.0.12077973'
  # SHA-256 of the release certificate. The publish step refuses any APK that
  # is not signed by this certificate, so a missing/wrong secret can never ship
  # a debug-signed build.
  EXPECTED_CERT_SHA256: bd30066f4f899289536cc73de68780a25a534447e646e6eac8686d9350072c1f

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag against pubspec version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pubspec="$(sed -nE 's/^version:[[:space:]]+([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          echo "tag=$TAG version=$version pubspec=$pubspec"
          if [ -z "$version" ] || [ "$version" != "$pubspec" ]; then
            echo "::error::tag $TAG does not match pubspec.yaml version $pubspec"
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}([ -]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The repo points Gradle at a Huawei mirror for the author's local
      # network. GitHub runners should use the official distribution.
      - name: Use official Gradle distribution in CI
        run: |
          sed -i \
            's#mirrors.huaweicloud.com/gradle/gradle-8.12-all.zip#services.gradle.org/distributions/gradle-8.12-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install SQLite headers for sqflite_common_ffi
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Resolve packages
        run: flutter pub get

      # A tag must not publish something that would fail CI.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is missing; set the signing secrets first"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/essay-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=essay-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Verify signature and package artifacts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt; then
            echo "::error::APK is not signed with APK Signature Scheme v2"
            exit 1
          fi
          cert="$(sed -n 's/.*certificate SHA-256 digest: //p' apksigner.txt | head -n1)"
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::signed by unexpected certificate $cert"
            exit 1
          fi
          abis="$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "::error::expected an arm64-v8a only APK, found ABIs: $abis"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/essay_trainer-${version}-arm64-v8a.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS && cat SHA256SUMS)
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(awk '{print $1}' dist/SHA256SUMS)" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "文衡 $version 的正式签名发行版（arm64-v8a，Android 7.0+）。"
            echo
            awk -v ver="$version" '
              $0 ~ "^## " ver "([ -]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### 安装"
            echo
            echo "1. 下载 \`essay_trainer-${version}-arm64-v8a.apk\`。"
            echo "2. 在手机上打开，允许“安装未知应用”后安装；旧版本可直接覆盖升级。"
            echo "3. 首次使用需要进入「设置 → DeepSeek 连接」填写自己的 API Key。"
            echo
            echo "### 校验"
            echo
            echo '```text'
            echo "APK SHA-256:      ${APK_SHA256}"
            echo "签名证书 SHA-256: ${CERT_SHA256}"
            echo '```'
            echo
            echo '本地校验：'
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "apksigner verify --print-certs essay_trainer-${version}-arm64-v8a.apk"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
            --title "文衡 ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag
